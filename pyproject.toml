[project]
name = "jellyfin-media-normalizer"
version = "0.1.0"
description = "Normalize movie and TV series names for Jellyfin, validate matches, and add provider IDs for reliable library identification."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pokornyIt" }]
keywords = [
  "jellyfin",
  "media",
  "rename",
  "normalization",
  "tmdb",
  "tvdb",
  "synology",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]

dependencies = [
  "click>=8.1.8",
  "pydantic>=2.12,<3",
  "httpx>=0.28.1",
  "rapidfuzz>=3.13.0",
  "rich>=14.0.0",
  "jinja2>=3.1.6",
]

[project.scripts]
jellyfin-media-normalizer = "jellyfin_media_normalizer.main:main"

[project.urls]
Homepage = "https://github.com/pokornyIt/jellyfin-media-normalizer"
Repository = "https://github.com/pokornyIt/jellyfin-media-normalizer"
Issues = "https://github.com/pokornyIt/jellyfin-media-normalizer/issues"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.16",
  "pyright>=1.1.411",
  "pre-commit>=4.6.0",
  "respx>=0.21",       # httpx mocking
]

[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jellyfin_media_normalizer"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "B", "D", "E4", "E7", "E9", "F", "I", "N", "RUF", "SIM", "UP"]
ignore = ["E501", "D100", "D104"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportUnusedImport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
